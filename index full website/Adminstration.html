<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AKAZI - Worker Registration</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background:
                linear-gradient(rgba(235, 243, 255, 0.88),
                                rgba(205, 224, 255, 0.92)),
                url("logo.png");

            background-size: 750px;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 15px 50px;
        }


        /* ===== LOGO ===== */

        .logo {
            width: 260px;
            max-width: 80%;
            margin-bottom: 20px;
            object-fit: contain;
        }


        /* ===== FORM CARD ===== */

        .form-box {
            width: 100%;
            max-width: 650px;

            background: rgba(255, 255, 255, 0.96);

            padding: 35px 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 45px rgba(0, 45, 120, 0.25);

            backdrop-filter: blur(5px);
        }


        /* ===== TITLE ===== */

        .form-box h1 {
            text-align: center;

            color: #0758d9;

            font-size: 32px;

            margin-bottom: 8px;
        }

        .title-line {
            width: 70px;
            height: 4px;

            background: #0758d9;

            border-radius: 10px;

            margin: 0 auto 25px;
        }


        /* ===== LABEL ===== */

        .form-box label {
            display: block;

            color: #14213d;

            font-size: 15px;

            font-weight: bold;

            margin-top: 15px;

            margin-bottom: 7px;
        }


        /* ===== INPUT ===== */

        .form-box input {
            width: 100%;

            height: 50px;

            border: 2px solid #d7e2f3;

            border-radius: 9px;

            padding: 0 15px;

            font-size: 15px;

            color: #333;

            outline: none;

            background: #ffffff;

            transition: 0.3s;
        }


        .form-box input:focus {
            border-color: #1261e8;

            box-shadow:
                0 0 0 3px rgba(18, 97, 232, 0.10);
        }


        .form-box input::placeholder {
            color: #9aa5b5;
        }


        /* ===== FILE INPUT ===== */

        .form-box input[type="file"] {
            padding: 12px;

            cursor: pointer;

            background: #f8fbff;
        }


        /* ===== SAVE BUTTON ===== */

        .form-box button {
            width: 100%;

            height: 52px;

            margin-top: 28px;

            border: none;

            border-radius: 9px;

            background: linear-gradient(
                90deg,
                #0758d9,
                #126ff2
            );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .form-box button:hover {
            background: linear-gradient(
                90deg,
                #064bb8,
                #0758d9
            );

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(7, 88, 217, 0.30);
        }


        /* ===== FOOTER ===== */

        .footer {
            margin-top: 20px;

            color: #0758d9;

            font-size: 13px;

            font-weight: bold;

            text-align: center;
        }


        /* ===== MOBILE ===== */

        @media (max-width: 600px) {

            body {
                padding: 15px 10px 30px;

                background-size: 500px;
            }

            .logo {
                width: 210px;

                margin-bottom: 10px;
            }

            .form-box {
                padding: 25px 20px;

                border-radius: 15px;
            }

            .form-box h1 {
                font-size: 26px;
            }

            .form-box input {
                height: 48px;
            }

            .form-box button {
                height: 50px;
            }
        }

    </style>
</head>


<body>


    <!-- AKAZI LOGO -->
    <img src="logo.png"
         alt="AKAZI COMPANY LTD"
         class="logo">


    <!-- WORKER FORM -->

    <form class="form-box"
          action="save_worker.php"
          method="POST"
          enctype="multipart/form-data">


        <h1>Worker Registration</h1>

        <div class="title-line"></div>


        <!-- ID -->

        <label>ID</label>

        <input type="text"
               name="worker_id"
               placeholder="Enter ID"
               required>


        <!-- FULL NAME -->

        <label>Full Name</label>

        <input type="text"
               name="full_name"
               placeholder="Enter full name"
               required>


        <!-- AGE -->

        <label>Age</label>

        <input type="number"
               name="age"
               placeholder="Enter age"
               required>


        <!-- JOB -->

        <label>Type of Work</label>

        <input type="text"
               name="job"
               placeholder="Enter job"
               required>


        <!-- CERTIFICATE -->

        <label>Certificate</label>

        <input type="file"
               name="certificate"
               accept=".pdf,.jpg,.jpeg,.png"
               >


        <!-- LOCATION -->

        <label>Location</label>

        <input type="text"
               name="location"
               placeholder="Enter location"
               required>


        <!-- PHONE -->

        <label>Phone Number</label>

        <input type="tel"
               name="phone"
               placeholder="Enter phone number"
               required>


        <!-- EMAIL -->

        <label>Email</label>

        <input type="email"
               name="email"
               placeholder="Enter email"
               required>


        <!-- BUTTON -->

        <button type="submit">
            Save Worker
        </button>


    </form>


    <div class="footer">
        CONNECTING TALENT, CREATING OPPORTUNITIES
    </div>


</body>
</html>
